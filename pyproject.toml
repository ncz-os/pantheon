[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-pantheon"
version = "0.2.0"
description = "Extracted PANTHEON LLM facade subsystem for the Mnemos namespace."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MNEMOS Contributors" }]
maintainers = [{ name = "Jason Perlow", email = "jperlow@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mnemos-core>=6.1,<6.2",
    "mnemos-graeae>=0.1.0,<0.2",
    "mnemos-knemon>=0.1,<0.2",
    "fastapi",
    "gunicorn",
    "httpx",
    "uvicorn",
]

[project.optional-dependencies]
nats = ["nats-py"]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "mnemos.api",
    "mnemos.api.routes",
    "mnemos.domain.pantheon",
    "mnemos.domain.pantheon.*",
    "mnemos.workers",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../graeae", "../knemon"]
