[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-pantheon"
version = "0.2.0"
description = "Extracted PANTHEON LLM facade subsystem for the Mnemos namespace."
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MNEMOS Contributors" }]
maintainers = [{ name = "Jason Perlow", email = "jperlow@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mnemos-core>=6.2,<8",
    "mnemos-graeae>=0.1.0,<0.2",
    "mnemos-knemon>=0.1,<0.2",
    "fastapi",
    "gunicorn",
    "httpx",
    "uvicorn",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
nats = ["nats-py"]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv.sources]
# Development overlays must resolve actual production code, never placeholder packages.
mnemos-core = { path = "../mnemos-core", editable = true }
mnemos-graeae = { path = "../graeae", editable = true }
mnemos-knemon = { path = "../knemon", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "mnemos.api",
    "mnemos.api.routes",
    "mnemos.domain.pantheon",
    "mnemos.domain.pantheon.*",
    "mnemos.workers",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.22.1",
    "mcp>=1,<2",
]
