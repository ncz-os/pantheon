[project]
name = "mnemos-core"
version = "6.2.5"
description = "Local stub for PANTHEON telemetry-loss-reporting fix — mnemos-core is not published to PyPI as an independently installable distribution in this checkout; this stub exists only so uv's resolver can satisfy `mnemos-core>=6.2,<7` here. The real `mnemos.core` runtime is provided by the PEP 420 namespace contribution that the project's existing `mnemos/` directory already supplies, plus the pythonpath fallback in `[tool.pytest.ini_options]`. The stub ships no Python package so setuptools' wheel build cannot synthesize an `mnemos/__init__.py` that would shadow the project's namespace."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
# Explicit empty: the stub ships no Python packages. Auto-discovery is
# disabled (we list nothing to include) so setuptools never emits an
# `mnemos/__init__.py` into the wheel, preserving the PEP 420
# namespace contribution to the project's existing `mnemos.api` /
# `mnemos.domain` packages.
include = []
